name: Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMUX_KEYSTORE_FILE: ${{ github.workspace }}/.signing/imux-test.jks
      IMUX_KEYSTORE_PASSWORD: imux-test-password
      IMUX_KEY_ALIAS: imux-test
      IMUX_KEY_PASSWORD: imux-test-password
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0
            cmake;3.31.6
            ndk;27.0.12077973

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Generate temporary test keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$IMUX_KEYSTORE_FILE")"
          keytool -genkeypair \
            -keystore "$IMUX_KEYSTORE_FILE" \
            -storepass "$IMUX_KEYSTORE_PASSWORD" \
            -keypass "$IMUX_KEY_PASSWORD" \
            -alias "$IMUX_KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=Imux CI Test,O=Imux,OU=CI"
          chmod 600 "$IMUX_KEYSTORE_FILE"

      - name: Assemble signed release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify signed release APK
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/release/app-release.apk
          apksigner verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Imux-Launcher-release.apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Clean temporary signing material
        if: ${{ always() }}
        run: rm -f "$IMUX_KEYSTORE_FILE"
