name: Build Imux Launcher

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run game-core unit tests
        run: gradle :game-core:testDebugUnitTest --no-daemon

      - name: Run launcher lint
        run: gradle :launcher:lintDebug --no-daemon

      - name: Build debug APK
        run: gradle :launcher:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: imux-launcher-debug
          path: launcher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
